# Loki single-node config for the local/VPS observability stack.
#
# This is a small, persistent filesystem-backed deployment for one VPS. It is not a
# horizontally-scaled Loki cluster. Keep the Loki HTTP port private to the Compose network;
# Grafana and the OTel Collector use the internal service name.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Promote the low-cardinality OTel resource identity so Grafana dashboard selectors such as
  # `{service_name="pit-fintech-serving"}` work. Request/entity/trace fields remain structured
  # metadata and are filtered after the stream selector.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
