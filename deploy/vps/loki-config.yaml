# Minimal Loki config for the VPS observability stack.
#
# Loki is the log store (Grafana's LogQL backend). The scoring API's structured JSON logs land here
# via promtail (Windows) and are queryable in Grafana. Traces stay in Tempo, metrics stay in
# Prometheus -- Loki is logs only.
#
# Keep the numbers plain (no underscores): Go's YAML parser rejects `1_000_000` (see tempo-config).
# Schema may vary between Loki versions; if `loki` exits 1 on startup, check `docker logs loki`
# and align the schema_config block with the image's documented config.
#
# No secrets in this file.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
