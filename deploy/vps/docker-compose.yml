volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/pit-fintech:ro
    environment:
      - 'GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}'
      - 'GF_SMTP_HOST=${GF_SMTP_HOST:-}'
      - 'GF_SMTP_USER=${GF_SMTP_USER:-}'
      - 'GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}'
      - 'GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-}'
      - 'GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-localhost}'
      - 'GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}'
    restart: unless-stopped
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  cadvisor:
    image: google/cadvisor:latest
    container_name: cadvisor
    # ports:
    #   - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      # OTLP/HTTP from the app (PIT_OTEL_ENDPOINT) -> 4318.
      - "4318:4318"
      # OTLP/gRPC from the app, optional -> 4317.
      - "4317:4317"
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    # The official image runs non-root, while a newly-created named volume is root-owned on this
    # VPS. Keep startup self-contained (no manual chown step after rsync) so Tempo can initialize
    # /tmp/tempo/blocks and /tmp/tempo/wal on the first `docker compose up -d`.
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      # Query frontend (Grafana Tempo data source).
      - "3200:3200"
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    restart: unless-stopped
