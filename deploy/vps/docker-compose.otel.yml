# OTel Collector + Tempo services for the VPS observability stack.
#
# Run standalone:   docker compose -f deploy/vps/docker-compose.otel.yml up -d
# Or merge the two `services:` entries into your existing ~/prometheus-grafana/docker-compose.yml.
#
# The scoring API on the Windows machine pushes OTLP/HTTP traces to
# http://<vps-tailscale-ip>:4318  (set PIT_OTEL_ENDPOINT on Windows). Prometheus keeps scraping
# the API's /metrics directly — see deploy/vps/prometheus-scrape-job.yml.
#
# No secrets in this file.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      # OTLP/HTTP from the app (PIT_OTEL_ENDPOINT) -> 4318.
      - "4318:4318"
      # OTLP/gRPC from the app, optional -> 4317.
      - "4317:4317"
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      # Query frontend (Grafana Tempo data source).
      - "3200:3200"
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped
