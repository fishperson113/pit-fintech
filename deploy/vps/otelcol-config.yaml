# OpenTelemetry Collector config for the VPS observability stack.
#
# Role split (see deploy/vps/README.md):
#   * Traces  -> OTLP/HTTP from the scoring API (PIT_OTEL_ENDPOINT) -> this collector -> Tempo
#   * Metrics -> Prometheus scrapes the API's /metrics directly; the OTel metrics the API also
#                sends are routed to `debug` (logged) so the export never fails loudly. Prometheus
#                self-hosted does NOT accept remote-write by default, so do not try to push metrics
#                into Prometheus here.
#
# No secrets in this file (AGENTS.md s7: the app repo only holds non-secret sample config).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      exporters: [debug]
