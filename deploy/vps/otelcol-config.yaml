# OpenTelemetry Collector config for the VPS observability stack.
#
# Pipelines:
#   * Traces -> Tempo
#   * Logs   -> Loki (JSON logs retain request_id/entity_id/step and trace_id/span_id)
#   * Metrics -> debug; Prometheus scrapes the API's /metrics directly
#
# The current PIT API emits structured JSON to stdout. To populate the logs pipeline, the API/worker
# must eventually export OTLP logs or a local Alloy/agent must forward those JSON lines to this
# collector's OTLP receiver. Traces and metrics remain independent of log ingestion.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic
  debug/logs:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki, debug/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
