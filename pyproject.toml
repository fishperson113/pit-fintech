[project]
name = "pit-fintech"
version = "0.1.0"
description = "Point-in-time correct feature platform for reproducible fraud scoring"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "deltalake>=1.2,<2",
    "duckdb>=1.4,<2",
    "psutil>=7,<8",
    "pyarrow>=21,<23",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "rich>=14,<15",
    "structlog>=25,<26",
    "typer>=0.20,<1",
]

[project.scripts]
pit = "pit_fintech.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.140,<7",
    "ipykernel>=7,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "numpy>=2.4,<3",
    "optuna>=4.9.0",
    "pre-commit>=4.3,<5",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.13,<1",
    "xgboost>=3.2.0",
]
training = [
    "lightgbm>=4.6,<5",
    "mlflow>=3.5,<4",
    "scikit-learn>=1.7,<2",
]
tracking = [
    "mlflow>=3.5,<4",
]
feast = [
    # Kept out of the main dependencies: Feast is a control-plane contract (ADR-006), never a
    # runtime dependency of the correctness path, so a Feast resolution failure must not be able
    # to break `test-temporal` / `test-unit`. Feast is pre-1.0, so a minor bump may break; the cap
    # is the next unreviewed minor. The duckdb/redis extras are required because the offline store
    # is DuckDB and the online store is Redis.
    # uv resolves ALL dependency-groups into a single universe, so a version this group requires
    # constrains every other group too -- there is no per-group override. In particular every
    # Feast release pins uvicorn[standard]>=0.30.6,<=0.34.0 transitively via this extra, which caps
    # what the "serving" group below may request (see ADR-006).
    "feast[duckdb,redis]>=0.65,<0.66",
]
serving = [
    "fastapi>=0.118,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.23,<1",
    "redis>=6.4,<8",
    # Pinned by Feast: every Feast release caps uvicorn transitively at <=0.34.0 (see ADR-006).
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pit_fintech"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "temporal: point-in-time correctness and temporal edge cases",
    "integration: tests spanning storage or service boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "feature_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory EDA surfaces: line-length, import-order/unused-import and
# one-line display statements are noise there. src/ and tests/ stay strict.
"notebooks/*.ipynb" = ["E402", "E501", "E702", "F401", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["pit_fintech"]

[tool.coverage.report]
show_missing = true
skip_covered = true
