# Non-secret application defaults. Override individual values with explicit PIT_* process environment variables.
# Keep this file as the normal local runtime configuration source.

project_root: .
data_root: ./data
artifact_root: ./artifacts
dataset: sample
paysim_csv: ./data/raw/paysim/PS_20174392719_1491204439457_log.csv

entity_definition_version: paysim-destination-customer-v1
feature_definition_version: paysim-fraud-recipient-v3
feature_service_version: paysim-fraud-scoring-v3
float_tolerance: 1.0e-6

redis_url: redis://localhost:6379/0
mlflow_tracking_uri: http://100.116.36.6:5000
# Serving keo dung model id nay tu registry chung o tren. Doi id de promote/rollback.
# Vi du: models:/paysim-fraud-lightgbm/3  hoac  runs:/<run_id>/model. null = giu resolution cu
# (champion alias / latest finished run). serving_model_local_fallback: null -> tu dung local sqlite.
serving_model_uri: models:/paysim-fraud-lightgbm/2
serving_model_local_fallback: null
# Cache model da keo ve (kieu HuggingFace-hub), key theo run id -> restart khong tai lai.
# null -> dung ~/.cache/pit-fintech/mlflow-models.
serving_model_cache_dir: null
api_host: 0.0.0.0
api_port: 8000
jupyter_port: 8888
log_level: INFO
log_json: false
otel_endpoint: http://100.116.36.6:4318
