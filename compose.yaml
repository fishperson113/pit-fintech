name: pit-fintech

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ADR-010 -- the event-based write path. Consumes score events from the Redis Stream and
  # maintains the online store under the optimistic lock, so the scoring API never mutates the
  # store or blocks on the offline engine. The API runs directly on the host (uvicorn) and
  # produces the events this worker consumes; a stopped worker makes `/score` time out
  # (`503 online_store_timeout`).
  pit-online-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UV_GROUPS: serving
        INSTALL_OTEL: "1"
    command:
      - uv
      - run
      - --no-sync
      - pit
      - serving
      - worker
      - --host
      - redis
      - --port
      - "6379"
    environment:
      PIT_REDIS_URL: redis://redis:6379/0
      PIT_LOG_JSON: "true"
    volumes:
      # The worker appends the Event History under artifacts/, so this mount is read-write.
      - ./artifacts:/app/artifacts
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
